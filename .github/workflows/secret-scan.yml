---
# =============================================================================
# Secret Scan on Pull Request
#
# Copy to: .github/workflows/secret-scan.yml in your repo.
#
# Runs gitleaks over the repo on every PR and on pushes to main. Costs nothing:
# it runs on a GitHub-hosted runner and needs no secrets, no API key, and no
# paid plan.
#
# WHAT THIS DOES AND DOES NOT DO
#
# It cannot BLOCK a merge. Required status checks need branch protection, which
# private repos do not get on GitHub's free plan. This surfaces findings; a human
# still has to look. Treat a red X as "stop", not as a gate that stopped you.
#
# It is also not sufficient on its own. gitleaks missed real credentials in this
# org -- values embedded in HTTP header strings, e.g.
#   $secret = 'X-AH-API-CLIENT-SECRET: dd2...';
# where the header-name prefix dilutes entropy and defeats the generic-api-key
# rule. A key-name regex caught those but missed define('XMC_TOKEN', '...').
# Run /endicott:secret-scan locally, which does both and diffs them.
#
# WHY THE BINARY AND NOT gitleaks-action
#
# gitleaks-action v2 requires a GITLEAKS_LICENSE for organization repos. Invoking
# the released binary directly sidesteps that entirely and pins the version, so a
# scan cannot change underneath you. Bump GITLEAKS_VERSION deliberately.
#
# BEFORE YOU ADD THIS TO A REPO -- READ THIS
#
# On a repo that ALREADY contains credentials (DeviceManager and Register do),
# adding this file alone makes every PR fail from day one. You will not be able
# to merge anything, so you will disable it, and a scanner people have learned to
# ignore is worse than no scanner. Do NOT add this workflow by itself to such a
# repo.
#
# Roll it out in ONE PR containing both of these:
#
#   1. This workflow.
#   2. A reviewed baseline, generated and committed in the same change:
#
#        gitleaks dir . --report-format json --report-path .gitleaks-baseline.json
#
#      Open that file and read every entry before you commit it. Each one is you
#      saying "I know this is here." Anything you cannot justify is not a baseline
#      entry -- it is an incident.
#
# The workflow picks the baseline up automatically if .gitleaks-baseline.json
# exists at the repo root; only NEW findings fail after that.
#
# A baseline is a stopgap, not a fix. Delete it once the credentials are ROTATED
# (the actual remediation) and moved to /etc/<app>/. Leaving it forever means the
# scan silently ignores real secrets in perpetuity.
#
# On a clean repo, just add the workflow. No baseline needed.
# =============================================================================

name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # gitleaks scans commits, not just the working tree. A shallow clone
          # would silently scan almost nothing and report clean.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl -sSL --fail -o "/tmp/${TARBALL}" "${BASE}/${TARBALL}"
          curl -sSL --fail -o /tmp/gitleaks_checksums.txt \
            "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # Verify before executing. Pinning a version is not integrity -- a tag's
          # asset can be replaced, a redirect hijacked, a runner MITM'd. This binary
          # is about to be installed to /usr/local/bin and run as root.
          cd /tmp
          grep " ${TARBALL}\$" gitleaks_checksums.txt > /tmp/expected.sha256
          if [ ! -s /tmp/expected.sha256 ]; then
            echo "::error::No checksum published for ${TARBALL}. Refusing to install."
            exit 1
          fi
          sha256sum -c /tmp/expected.sha256

          tar -xzf "/tmp/${TARBALL}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        run: |
          set -euo pipefail
          ARGS=(git . --log-opts "--all" --redact --no-banner)
          if [ -f .gitleaks-baseline.json ]; then
            echo "Using baseline .gitleaks-baseline.json -- only NEW findings fail."
            ARGS+=(--baseline-path .gitleaks-baseline.json)
          fi
          # Exit 0 = clean, 1 = leaks OR an internal error. Either way, stop.
          gitleaks "${ARGS[@]}"

      - name: What to do if this failed
        if: failure()
        run: |
          echo "::error::gitleaks found something, or errored. Do not merge until you have looked."
          echo ""
          echo "If it is a real credential:"
          echo "  1. ROTATE IT. That is the remediation. Purging history does not un-leak:"
          echo "     GitHub retains unreachable objects and every clone keeps its own copy."
          echo "  2. Move the value to /etc/<app>/config.php and read it via the Config class."
          echo "  3. Only then clean up the history."
          echo ""
          echo "If it is a false positive, add its fingerprint to .gitleaksignore with a"
          echo "comment justifying it. That file is how a real leak gets ignored forever,"
          echo "so make the reviewer's job easy."
