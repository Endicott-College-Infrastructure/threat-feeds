---
# =============================================================================
# Secret Scan on Pull Request
#
# Copy to: .github/workflows/secret-scan.yml in your repo.
#
# Runs gitleaks over the repo on every PR and on pushes to main. Costs nothing:
# it runs on a GitHub-hosted runner and needs no secrets, no API key, and no
# paid plan.
#
# WHAT THIS DOES AND DOES NOT DO
#
# It cannot BLOCK a merge. Required status checks need branch protection, which
# private repos do not get on GitHub's free plan. This surfaces findings; a human
# still has to look. Treat a red X as "stop", not as a gate that stopped you.
#
# It is also not sufficient on its own. gitleaks missed real credentials in this
# org -- values embedded in HTTP header strings, e.g.
#   $secret = 'X-AH-API-CLIENT-SECRET: dd2...';
# where the header-name prefix dilutes entropy and defeats the generic-api-key
# rule. A key-name regex caught those but missed define('XMC_TOKEN', '...').
# Run /endicott:secret-scan locally, which does both and diffs them.
#
# WHY THE BINARY AND NOT gitleaks-action
#
# gitleaks-action v2 requires a GITLEAKS_LICENSE for organization repos. Invoking
# the released binary directly sidesteps that entirely and pins the version, so a
# scan cannot change underneath you. Bump GITLEAKS_VERSION deliberately.
#
# BEFORE YOU ADD THIS TO A REPO -- READ THIS
#
# On a repo that ALREADY contains credentials (DeviceManager and Register do),
# adding this file alone makes every PR fail from day one. You will not be able
# to merge anything, so you will disable it, and a scanner people have learned to
# ignore is worse than no scanner. Do NOT add this workflow by itself to such a
# repo.
#
# Roll it out in ONE PR containing both of these:
#
#   1. This workflow.
#   2. A reviewed .gitleaksignore -- one fingerprint (commit:file:rule:line) per
#      known finding. Generate it with Step 6 of the /endicott:secret-scan skill,
#      which prints fingerprints only and writes no finding payload.
#
#      Read every line before you commit it. Each one is you saying "I know this
#      is here." Anything you cannot justify is not an ignore entry -- it is an
#      incident.
#
# gitleaks reads .gitleaksignore from the repo root on its own; only NEW findings
# fail after that. Nothing in this workflow has to point at it.
#
# DO NOT COMMIT A BASELINE JSON (--report-format json --report-path ...). It
# carries each finding's Match, full commit message and author email; it gets
# flagged by any scan that is not handed it, which is every scan but this one;
# and before 2026-09-24 the estate ruleset's --redact left the credential value
# itself in Match. A fingerprint carries none of that.
#
# An ignore entry is a stopgap, not a fix. Remove it once the credential is
# ROTATED (the actual remediation) and moved to /etc/<app>/. Leaving it forever
# means the scan silently ignores a real secret in perpetuity.
#
# On a clean repo, just add the workflow. No ignore file needed.
# =============================================================================

name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

env:
  GITLEAKS_VERSION: "8.30.1"
  # WHICH RULES THIS REPO SCANS WITH -- the one line to set per repo.
  #
  #   PHP repo:   ".github/gitleaks-endicott.toml"   stock + estate PHP ruleset
  #   otherwise:  ""                                 stock rules, on purpose
  #
  # The estate ruleset was built for legacy PHP, where credentials sit in bare
  # string literals that gitleaks' defaults deliberately ignore. On the PHP tree
  # it was measured on, stock rules found 14 real credentials and the ruleset
  # 24. On the Python repos it produced 206 false positives and no real finding
  # (2026-09-24) -- its keywords match field names like password_character_types
  # and private_ip. So only the PHP repos opt in.
  #
  # Set to a path, the file must exist or the scan refuses: a PHP repo that has
  # lost its copy would otherwise downgrade silently to stock rules. "" is the
  # explicit opt-out, the same contract as GITLEAKS_CONFIG in capture-app.sh.
  GITLEAKS_RULESET: ""  # not a PHP repo: stock rules, on purpose

# Least privilege for GITHUB_TOKEN. The default is whatever the repo setting
# says -- read/write here -- and a pull_request-triggered workflow runs code
# from a branch nobody has reviewed. None of these jobs write to the repo, open
# issues, or publish anything; they read the tree and report. Widen this per
# job, never globally, if that ever changes.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # gitleaks scans commits, not just the working tree. A shallow clone
          # would silently scan almost nothing and report clean.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl -sSL --fail -o "/tmp/${TARBALL}" "${BASE}/${TARBALL}"
          curl -sSL --fail -o /tmp/gitleaks_checksums.txt \
            "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # Verify before executing. Pinning a version is not integrity -- a tag's
          # asset can be replaced, a redirect hijacked, a runner MITM'd. This binary
          # is about to be installed to /usr/local/bin and run as root.
          cd /tmp
          grep " ${TARBALL}\$" gitleaks_checksums.txt > /tmp/expected.sha256
          if [ ! -s /tmp/expected.sha256 ]; then
            echo "::error::No checksum published for ${TARBALL}. Refusing to install."
            exit 1
          fi
          sha256sum -c /tmp/expected.sha256

          tar -xzf "/tmp/${TARBALL}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # In a repo that opts in, the ruleset is VENDORED at
      # .github/gitleaks-endicott.toml, byte-identical to the canonical copy in
      # the .github repo's templates/. That duplication is deliberate and it is
      # the lesser of two evils:
      #
      #   - CI checks out one repo. The canonical copy lives in a PRIVATE repo,
      #     and GITHUB_TOKEN is scoped to this repo only, so a workflow cannot
      #     read it. Org-level variables would solve it, but GitHub Free does
      #     not expose those to private repos.
      #   - The alternative is a PAT, which lint.yml already rejected for the
      #     vendor spec: "another credential to hold and rotate."
      #
      # So: copies, with drift made detectable instead of ignored.
      # /endicott:endicott-doctor compares every vendored copy against the
      # canonical one, locally, where all repos are visible at once.
      #
      # Do not edit the vendored file here. Edit the canonical copy and re-sync.
      - name: Scan
        run: |
          set -euo pipefail
          ARGS=(git . --log-opts "--all" --redact --no-banner)
          if [ -n "$GITLEAKS_RULESET" ]; then
            if [ ! -f "$GITLEAKS_RULESET" ]; then
              # Refuse rather than fall back. A pass built on stock rules in a
              # PHP repo looks identical to a real pass and is not one.
              echo "::error::$GITLEAKS_RULESET is missing. Refusing to scan with stock rules."
              echo "Re-sync it from the .github repo: templates/gitleaks-endicott.toml"
              exit 1
            fi
            ARGS+=(--config "$GITLEAKS_RULESET")
            echo "Rules: stock + estate PHP ruleset ($GITLEAKS_RULESET)"
          else
            echo "Rules: stock only (GITLEAKS_RULESET is empty -- see the env block)"
          fi
          # Refuse a committed baseline JSON outright rather than use it. It is
          # a payload -- Match, commit message, author email -- and it gets
          # flagged by every scan not handed it. Known findings go in
          # .gitleaksignore as fingerprints, which gitleaks reads on its own.
          if [ -f .gitleaks-baseline.json ]; then
            echo "::error::.gitleaks-baseline.json is committed. Delete it."
            echo "Use fingerprints in .gitleaksignore instead -- see this file's header."
            exit 1
          fi
          # Exit 0 = clean, 1 = leaks OR an internal error. Either way, stop.
          gitleaks "${ARGS[@]}"

      - name: What to do if this failed
        if: failure()
        run: |
          echo "::error::gitleaks found something, or errored. Do not merge until you have looked."
          echo ""
          echo "If it is a real credential:"
          echo "  1. ROTATE IT. That is the remediation. Purging history does not un-leak:"
          echo "     GitHub retains unreachable objects and every clone keeps its own copy."
          echo "  2. Move the value to /etc/<app>/config.php and read it via the Config class."
          echo "  3. Only then clean up the history."
          echo ""
          echo "If it is a false positive, add its fingerprint to .gitleaksignore with a"
          echo "comment justifying it. That file is how a real leak gets ignored forever,"
          echo "so make the reviewer's job easy."
